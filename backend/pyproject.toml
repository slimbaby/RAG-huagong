[project]
name = "langgraph-rag-backend"
version = "0.1.0"
description = "LangGraph RAG知识库系统后端"
requires-python = ">=3.10"
dependencies = [
    # Web框架
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    # LangGraph
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    # AI/ML
    "openai>=1.10.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=2.2.0",
    "setuptools",
    # 向量数据库
    "pymilvus>=2.3.6",
    # 文件解析
    "PyPDF2>=3.0.1",
    "PyMuPDF>=1.23.16",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.4",
    "chardet>=5.2.0",
    # 中文分词
    "jieba>=0.42.1",
    # OCR
    "paddlepaddle>=2.6.2",
    "paddleocr>=2.7.3",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    # 网页爬虫
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    # 数据库
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "alembic>=1.13.1",
    # 定时任务
    "apscheduler>=3.10.4",
    # 评估
    "ragas>=0.1.0",
    "datasets>=2.16.1",
    # 工具库
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.3",
    "scipy>=1.12.0",
    "tqdm>=4.66.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
