apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: chemical-rag
  labels:
    app: milvus
spec:
  type: ClusterIP
  selector:
    app: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
