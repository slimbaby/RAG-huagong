apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chemical-rag
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: chemical-rag-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chemical-rag-config
            - secretRef:
                name: chemical-rag-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
            - name: bm25-index
              mountPath: /app/bm25_index
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
        - name: logs
          persistentVolumeClaim:
            claimName: backend-logs
        - name: bm25-index
          persistentVolumeClaim:
            claimName: backend-bm25
