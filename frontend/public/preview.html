<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI 预览模式 - 化工园区RAG</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #070C1A; color: #E4EBF5; font-family: -apple-system, "Segoe UI", sans-serif; }
      .box { width: 420px; padding: 32px; border: 1px solid #1A2748; border-radius: 12px; background: #0D1525; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      p { font-size: 13px; color: #94A3B8; line-height: 1.8; margin: 0 0 8px; }
      a { color: #4F8CFF; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>UI 预览模式</h1>
      <p>正在写入本地预览登录态并跳转到主界面…</p>
      <p>仅用于查看页面外观，无需 Docker 或后端。接口请求会失败，列表为空属正常现象。</p>
      <p>若没有自动跳转，请<a href="/">点此进入</a>。</p>
    </div>
    <script>
      // 前端 RequireAuth 只检查 localStorage 中的 token；authStore.init 请求 /auth/me
      // 失败后会降级读取缓存角色，因此无后端时也能进入全部页面查看 UI。
      localStorage.setItem('rag_auth_token', 'ui-preview-token');
      localStorage.setItem('rag_auth_user', '预览用户');
      localStorage.setItem('rag_auth_role', JSON.stringify({
        role_id: 'admin', role_name: '管理员（预览）', scope_ids: ['all']
      }));
      setTimeout(function () { location.replace('/'); }, 600);
    </script>
  </body>
</html>
